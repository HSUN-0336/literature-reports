name: Daily Literature Report

on:
  workflow_dispatch:
  schedule:
    - cron: "12 6 * * *"

permissions:
  contents: write

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect literature
        env:
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
        run: python scripts/collect_literature.py

      - name: Generate report and send email
        env:
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/send_email.py

      - name: Commit reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily literature report"
            git push
          fi

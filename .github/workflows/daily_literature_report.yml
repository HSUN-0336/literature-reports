name: Daily Literature Report

on:
  schedule:
    # GitHub cron uses UTC. These two times cover Paris 08:00 across DST:
    # 06:00 UTC = 08:00 in Paris summer time (CEST)
    # 07:00 UTC = 08:00 in Paris winter time (CET)
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Paris time gate
        id: timegate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          now_paris = datetime.now(ZoneInfo("Europe/Paris"))
          print("Current Paris time:", now_paris.isoformat())

          should_run = event_name == "workflow_dispatch" or now_paris.hour == 8
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      - name: Stop if not 08:00 Paris time
        if: steps.timegate.outputs.should_run != 'true'
        run: echo "Not 08:00 Paris time; skipping this scheduled run."

      - name: Checkout repository
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.timegate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect literature
        if: steps.timegate.outputs.should_run == 'true'
        env:
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
        run: python scripts/collect_literature.py

      - name: Generate report and send email
        if: steps.timegate.outputs.should_run == 'true'
        env:
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/send_email.py

      - name: Commit reports
        if: steps.timegate.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily literature report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload reports as artifact
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-literature-report
          path: reports/
          retention-days: 90
